site_name: illusion
site_description: Documentation for the illusion 3D game engine
site_url: https://oguzhanaknc.github.io/illusion/
repo_url: https://github.com/oguzhanaknc/illusion
repo_name: oguzhanaknc/illusion
edit_uri: edit/main/docs/content/
docs_dir: docs/content
copyright: Copyright &copy; illusion contributors

# Broken links and anchors are warnings, which `mkdocs build --strict` (CI) turns into errors.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: tr
          name: Türkçe
          build: true
          nav_translations:
            Home: Ana Sayfa
            Getting Started: Başlarken
            Manual: Kılavuz
            Logging: Logging
            Memory: Bellek
            Job System: Job System
            ECS: ECS
            Reflection and Scenes: Reflection ve Sahneler
            Profiling: Profiling
            Windows and Input: Pencereler ve Input
            Events and Time: Event'ler ve Zaman
            File System: Dosya Sistemi
            Rendering: Rendering
            Assets and Models: Asset'ler ve Modeller
            Physics: Fizik
            Audio: Ses
            Gamepads: Gamepad'ler
            Input Actions: Input Action'ları
            Architecture: Mimari
            Overview: Genel Bakış
            Decisions: Kararlar
            Reference: Referans
            API Reference: API Referansı
            Contributing: Katkıda Bulunma

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Manual:
      - Logging: manual/logging.md
      - Memory: manual/memory.md
      - Job System: manual/jobs.md
      - ECS: manual/ecs.md
      - Reflection and Scenes: manual/scenes.md
      - Windows and Input: manual/platform.md
      - Gamepads: manual/gamepads.md
      - Input Actions: manual/actions.md
      - Events and Time: manual/events.md
      - File System: manual/filesystem.md
      - Rendering: manual/rendering.md
      - Assets and Models: manual/assets.md
      - Physics: manual/physics.md
      - Audio: manual/audio.md
      - Profiling: manual/profiling.md
  - Architecture:
      - Overview: architecture/overview.md
      - Decisions: architecture/decisions.md
  - Reference:
      - API Reference: reference/api.md
  - Contributing: contributing.md
