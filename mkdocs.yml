site_name: illusion
site_description: Documentation for the illusion 3D game engine
site_url: https://oguzhanaknc.github.io/illusion/
repo_url: https://github.com/oguzhanaknc/illusion
repo_name: oguzhanaknc/illusion
edit_uri: edit/main/docs/content/
docs_dir: docs/content
copyright: Copyright &copy; illusion contributors

# Broken links and anchors are warnings, which `mkdocs build --strict` (CI) turns into errors.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: tr
          name: Türkçe
          build: true
          nav_translations:
            Home: Ana Sayfa
            Getting Started: Başlarken
            Manual: Kılavuz
            Logging: Logging
            Memory: Bellek
            JSON and Expected: JSON ve Expected
            Random Numbers: Rastgele Sayılar
            Math: Matematik
            Localization: Yerelleştirme
            Job System: Job System
            ECS: ECS
            Reflection: Reflection
            Scenes: Sahneler
            Profiling: Profiling
            Windows and Input: Pencereler ve Input
            Events and Time: Event'ler ve Zaman
            File System: Dosya Sistemi
            Rendering: Rendering
            Assets and Models: Asset'ler ve Modeller
            Physics: Fizik
            Audio: Ses
            Particles: Parçacıklar
            Game Modules: Oyun Modülleri
            Game Runtime: Oyun Runtime'ı
            Gamepads: Gamepad'ler
            Input Actions: Input Action'ları
            Architecture: Mimari
            Overview: Genel Bakış
            Decisions: Kararlar
            Editor: Editör
            Reference: Referans
            API Reference: API Referansı
            Editor Core: Editör Çekirdeği
            Projects: Projeler
            Editor Commands: Editör Komutları
            Automation: Otomasyon
            Editor Protocol: Editör Protokolü
            Scripting API: Scripting API
            AI Agents: Yapay Zekâ Ajanları
            Showcase Project: Showcase Projesi
            Tech Demo Project: Teknoloji Demosu Projesi
            Editor Window: Editör Penceresi
            Outliner and Inspector: Outliner ve Inspector
            Scene Viewport: Scene Viewport'u
            Transform Tools: Dönüşüm Araçları
            Play Mode: Play Modu
            Prefabs: Prefab'lar
            Profiler and Diagnostics: Profiler ve Diagnostics
            Project Modules: Proje Modülleri
            Exporting a game: Oyunu Export Etmek
            Preferences: Tercihler
            Guides: Rehberler
            Releasing a game: Oyunu Yayınlamak
            Tutorials: Eğitimler
            First Agent Session: İlk Ajan Oturumu
            Tetris with an Agent: Ajanla Tetris
            Tetris by Hand: Elle Tetris
            Contributing: Katkıda Bulunma

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Manual:
