name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # bash everywhere (Git Bash on Windows) so `| tee` + pipefail behave the same on all runners.
    shell: bash

env:
  # Shared runners are noisy; benchmarks may take up to 3x their budget before failing.
  ILLUSION_BENCH_TOLERANCE: "3.0"
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
      contents: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      # The build jobs are skipped only when every changed file is one that no build, test or check reads.
      # Anything unknown (manual runs, first pushes, API errors, huge diffs) counts as a code change.
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          names='.[] | .filename, (.previous_filename // empty)'
          files=""
          if [[ "$EVENT" == pull_request ]]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q "$names") || files=""
          elif [[ "$EVENT" == push && -n "$BEFORE" && "$BEFORE" != 0000000* ]]; then
            compared="if (.files | length) < 300 then .files | $names else empty end"
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" -q "$compared") || files=""
          fi
          skippable='^(ROADMAP\.md|AGENTS\.md|CLAUDE\.md|README\.md|\.gitignore|\.claude/.*|docs/adr/.*)$'
          code=true
          if [[ -n "$files" ]] && ! grep -qvE "$skippable" <<<"$files"; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements-dev.txt
      - run: python tools/check_format.py
      - name: Engine/editor layering (ADR 0030)
        run: python tools/check_layering.py
      - name: Scripting API coverage (showcase module)
        run: python tools/check_api_coverage.py
      - name: Tech demo asset tools
        run: python -m unittest discover -s samples/techdemo/tools -p "test_*.py"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows MSVC, os: windows-2025, preset: ci-windows-msvc }
          - { name: Windows clang-cl, os: windows-2025, preset: ci-windows-clang }
          - { name: Linux GCC, os: ubuntu-24.04, preset: ci-linux-gcc }
          - { name: Linux Clang, os: ubuntu-24.04, preset: ci-linux-clang }
          - { name: macOS AppleClang, os: macos-15, preset: ci-macos-clang }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: pip install ninja==1.13.2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # X11 and Wayland development files for GLFW.
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev
          libxi-dev libxext-dev
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Restore the Slang compiler download
        # Release downloads from GitHub fail during outages (HTTP 504); FetchContent skips a download whose
        # file is already there with the pinned SHA-256, so a cached archive keeps configure working.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/${{ matrix.preset }}/_deps/slang-subbuild/slang-populate-prefix/src/slang-*.tar.gz
          key: slang-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: slang-${{ matrix.preset }}-
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} 2>&1 | tee configure.log
      - name: Build (Debug)
        run: cmake --build --preset ${{ matrix.preset }}-debug -- -k 0 2>&1 | tee build-debug.log
      - name: Test (Debug)
        run: ctest --preset ${{ matrix.preset }}-debug -LE "gpu|display" 2>&1 | tee test-debug.log
      - name: Build (Release)
        run: cmake --build --preset ${{ matrix.preset }}-release -- -k 0 2>&1 | tee build-release.log
      - name: Test + benchmarks (Release)
        run: ctest --preset ${{ matrix.preset }}-release -LE "gpu|display" 2>&1 | tee test-release.log
      - name: Annotate failures
        if: failure()
        run: python tools/ci/annotate_log.py configure.log build-debug.log test-debug.log build-release.log test-release.log

  runtime-only:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The engine without the editor (ADR 0030): proves that nothing outside editor/ needs it.
    name: Runtime-only build (Linux GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: pip install ninja==1.13.2
      - name: Install Linux build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev
          libxi-dev libxext-dev
      - name: Restore the Slang compiler download
        # Release downloads from GitHub fail during outages (HTTP 504); FetchContent skips a download whose
        # file is already there with the pinned SHA-256, so a cached archive keeps configure working.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci-linux-gcc/_deps/slang-subbuild/slang-populate-prefix/src/slang-*.tar.gz
          key: slang-ci-linux-gcc-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: slang-ci-linux-gcc-
      - name: Configure (editor off)
        run: cmake --preset ci-linux-gcc -DILLUSION_BUILD_EDITOR=OFF 2>&1 | tee configure.log
      - name: No editor targets
        run: |
          ! grep -qE 'illusion_editor|illusion_imgui' build/ci-linux-gcc/*.ninja
      - name: Build (Debug)
        run: cmake --build --preset ci-linux-gcc-debug -- -k 0 2>&1 | tee build.log
      - name: Test (Debug)
        run: ctest --preset ci-linux-gcc-debug -LE "gpu|display" 2>&1 | tee test.log
      - name: Annotate failures
        if: failure()
        run: python tools/ci/annotate_log.py configure.log build.log test.log

  sanitizers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Linux Clang ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ASan+UBSan, preset: ci-linux-clang-asan }
          - { name: TSan, preset: ci-linux-clang-tsan }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: pip install ninja==1.13.2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # X11 and Wayland development files for GLFW.
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev
          libxi-dev libxext-dev
      - name: Reduce ASLR entropy (required by TSan on recent kernels)
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Restore the Slang compiler download
        # Release downloads from GitHub fail during outages (HTTP 504); FetchContent skips a download whose
        # file is already there with the pinned SHA-256, so a cached archive keeps configure working.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/${{ matrix.preset }}/_deps/slang-subbuild/slang-populate-prefix/src/slang-*.tar.gz
          key: slang-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: slang-${{ matrix.preset }}-
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} 2>&1 | tee configure.log
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-relwithdebinfo -- -k 0 2>&1 | tee build.log
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --preset ${{ matrix.preset }}-relwithdebinfo -LE "gpu|display" 2>&1 | tee test.log
      - name: Annotate failures
        if: failure()
        run: python tools/ci/annotate_log.py configure.log build.log test.log

  gpu:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Linux GPU (lavapipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: pip install ninja==1.13.2
      - name: Install build and Vulkan dependencies
        # Mesa lavapipe provides a software Vulkan 1.3 driver; Xvfb provides a display for swapchains.
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev
          libxi-dev libxext-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
      - name: Restore the Slang compiler download
        # Release downloads from GitHub fail during outages (HTTP 504); FetchContent skips a download whose
        # file is already there with the pinned SHA-256, so a cached archive keeps configure working.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci-linux-clang/_deps/slang-subbuild/slang-populate-prefix/src/slang-*.tar.gz
          key: slang-ci-linux-clang-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: slang-ci-linux-clang-
      - name: Configure
        run: cmake --preset ci-linux-clang 2>&1 | tee configure.log
      - name: Build
        run: cmake --build --preset ci-linux-clang-debug -- -k 0 2>&1 | tee build.log
      - name: GPU tests (validation on)
        run: xvfb-run -a ctest --preset ci-linux-clang-debug -L "gpu|display" 2>&1 | tee test.log
      - name: Sample smoke run
        run: xvfb-run -a ./build/ci-linux-clang/samples/Debug/illusion_hello_triangle --frames 120 2>&1 | tee sample.log
      - name: UI gallery smoke run
        run: xvfb-run -a ./build/ci-linux-clang/bin/Debug/illusion_ui_gallery --frames 60 2>&1 | tee gallery.log
      - name: Upload UI captures for design review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-captures
          path: build/ci-linux-clang/ui-captures/
          if-no-files-found: warn
      - name: Annotate failures
        if: failure()
        run: python tools/ci/annotate_log.py configure.log build.log test.log sample.log gallery.log

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - name: English/Turkish parity
        run: python tools/check_docs_parity.py
      - name: Build site (strict)
        run: mkdocs build --strict
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen
      - name: API reference (warnings are errors)
        run: doxygen docs/Doxyfile
